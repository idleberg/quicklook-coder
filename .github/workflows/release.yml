name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The folder holding quicklook.config.*, relative to the repository root.
  PROJECT: .

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Release builds are universal (arm64 + x86_64) by default.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ${{ env.PROJECT }}
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package app
        id: package
        run: |
          cd "$PROJECT/.quicklook/build"
          app=$(ls -d *.app)
          zip="${app%.app}"
          zip="${zip// /-}-${GITHUB_REF_NAME}.zip"
          zip -r -9 -y "$GITHUB_WORKSPACE/$zip" "$app"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$zip" > SHA256SUMS
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS
          generate_release_notes: true
