name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The folder holding quicklook.config.*, relative to the repository root.
  PROJECT: .

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/pnpm/store
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      # Builds the macOS app, universal (arm64 + x86_64) by default, and the Windows plugin.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ${{ env.PROJECT }}
        env:
          VERSION: ${{ github.ref_name }}

      # Quick-Look-Coder-<tag>-macos.zip and Quick-Look-Coder-<tag>-windows.qlplugin
      - name: Package
        run: |
          mkdir release
          cd "$PROJECT/.quicklook/build"
          app=$(basename macos/*.app .app)
          (cd macos && zip -r -9 -y "$GITHUB_WORKSPACE/release/${app// /-}-$GITHUB_REF_NAME-macos.zip" "$app.app")
          cp windows/*.qlplugin "$GITHUB_WORKSPACE/release/${app// /-}-$GITHUB_REF_NAME-windows.qlplugin"
          cd "$GITHUB_WORKSPACE/release"
          shasum -a 256 * > SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true
