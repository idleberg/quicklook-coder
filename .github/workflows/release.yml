name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The folder holding quicklook.config.*, relative to the repository root.
  PROJECT: .

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/pnpm/store
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # Release builds are universal (arm64 + x86_64) by default.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ${{ env.PROJECT }}
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package app
        id: package
        run: |
          cd "$PROJECT/.quicklook/build"
          app=$(ls -d *.app)
          zip="${app%.app}"
          zip="${zip// /-}-${GITHUB_REF_NAME}.zip"
          zip -r -9 -y "$GITHUB_WORKSPACE/$zip" "$app"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$zip" > SHA256SUMS
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS
          generate_release_notes: true
